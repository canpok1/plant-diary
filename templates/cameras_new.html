<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物観察日記 - カメラ追加</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
            background-color: #ffffff;
            color: #333333;
            line-height: 1.6;
        }

        header {
            background-color: #4a7c59;
            color: #ffffff;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: bold;
        }

        header h1 a {
            color: #ffffff;
            text-decoration: none;
        }

        header h1 a:hover {
            text-decoration: underline;
        }

        header nav {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: auto;
        }

        header nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            opacity: 0.85;
        }

        header nav a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        header nav .user-info {
            font-size: 0.9rem;
            opacity: 0.85;
        }

        header nav .logout-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 4px;
            color: #ffffff;
            cursor: pointer;
            font-size: 0.9rem;
            opacity: 0.85;
            padding: 4px 10px;
        }

        header nav .logout-btn:hover {
            opacity: 1;
            background-color: rgba(255, 255, 255, 0.15);
        }

        .back-link {
            display: inline-block;
            margin: 16px 24px;
            color: #4a7c59;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 24px 48px;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 24px;
            color: #333333;
        }

        .create-form {
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 24px;
            max-width: 480px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: #555555;
            margin-bottom: 6px;
        }

        .form-group input[type="text"],
        .form-group select {
            width: 100%;
            padding: 8px 12px;
            font-size: 0.95rem;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background-color: #ffffff;
            color: #333333;
        }

        .form-group input[type="text"]:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4a7c59;
        }

        .submit-btn {
            padding: 8px 20px;
            font-size: 0.95rem;
            border: none;
            border-radius: 6px;
            background-color: #4a7c59;
            color: #ffffff;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #3a6347;
        }

        @media screen and (max-width: 640px) {
            header {
                padding: 12px 16px;
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            header h1 {
                font-size: 1.25rem;
            }

            .back-link {
                margin: 12px 16px;
            }

            main {
                padding: 0 16px 32px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="/">植物観察日記</a></h1>
        <nav>
            <a href="/books/new">日記帳作成</a>
            <a href="/cameras">カメラ</a>
            <span class="user-info">{{.Username}}</span>
            <form method="POST" action="/logout" style="display:inline">
                <button type="submit" class="logout-btn">ログアウト</button>
            </form>
        </nav>
    </header>
    <a class="back-link" href="/cameras">&larr; カメラ一覧へ戻る</a>
    <main>
        <h2>カメラを追加</h2>
        <form class="create-form" method="POST" action="/cameras">
            <div class="form-group">
                <label for="name">カメラ名</label>
                <input type="text" id="name" name="name" placeholder="例: ベランダカメラ" required>
            </div>
            <div class="form-group">
                <label for="book_id">日記帳</label>
                <select id="book_id" name="book_id" required>
                    <option value="">選択してください</option>
                    {{range .Books}}
                    <option value="{{.ID}}">{{.Name}}</option>
                    {{end}}
                </select>
            </div>
            <button class="submit-btn" type="submit">追加</button>
        </form>
    </main>
</body>
</html>
