{{define "header"}}
<header>
    <h1><a href="/">植物観察日記</a></h1>
    <nav>
        {{if .LoggedIn}}
        <a href="/books/new">日記帳作成</a>
        <a href="/cameras">カメラ</a>
        <span class="user-info">{{.Username}}</span>
        <form method="POST" action="/logout" style="display:inline">
            <button type="submit" class="logout-btn">ログアウト</button>
        </form>
        {{else}}
        <a href="/login">ログイン</a>
        {{end}}
    </nav>
</header>
{{end}}
