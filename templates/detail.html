<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物日記 - 詳細</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
            background-color: #ffffff;
            color: #333333;
            line-height: 1.8;
        }

        header {
            background-color: #4a7c59;
            color: #ffffff;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: bold;
        }

        header h1 a {
            color: #ffffff;
            text-decoration: none;
        }

        header nav {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: auto;
        }

        header nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            opacity: 0.85;
        }

        header nav a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        header nav .user-info {
            font-size: 0.9rem;
            opacity: 0.85;
        }

        header nav .logout-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 4px;
            color: #ffffff;
            cursor: pointer;
            font-size: 0.9rem;
            opacity: 0.85;
            padding: 4px 10px;
        }

        header nav .logout-btn:hover {
            opacity: 1;
            background-color: rgba(255, 255, 255, 0.15);
        }

        .back-link {
            display: inline-block;
            margin: 16px 24px;
            color: #557a3e;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .detail-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 24px 48px;
        }

        .detail-image {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }

        .detail-meta {
            margin-top: 16px;
            color: #888888;
            font-size: 0.85rem;
        }

        .detail-content {
            margin-top: 24px;
            font-size: 1rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .edit-link {
            display: inline-block;
            margin-top: 24px;
            padding: 6px 16px;
            background-color: #557a3e;
            color: #ffffff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .edit-link:hover {
            background-color: #446530;
        }

        @media (max-width: 600px) {
            header {
                padding: 12px 16px;
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            header h1 {
                font-size: 1.25rem;
            }

            .back-link {
                margin: 12px 16px;
            }

            .detail-container {
                padding: 0 16px 32px;
            }

            .detail-meta {
                font-size: 0.8rem;
            }

            .detail-content {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="/">植物日記</a></h1>
        <nav>
            {{if .LoggedIn}}
            <span class="user-info">{{.Username}}</span>
            <form method="POST" action="/logout" style="display:inline">
                <button type="submit" class="logout-btn">ログアウト</button>
            </form>
            {{else}}
            <a href="/login">ログイン</a>
            {{end}}
        </nav>
    </header>
    <a class="back-link" href="/">&larr; 一覧へ戻る</a>
    <main class="detail-container">
        <img class="detail-image" src="/photos/{{.Diary.ImagePath}}" alt="植物の写真">
        <p class="detail-meta">{{(.Diary.CreatedAt | toJST).Format "2006年1月2日"}}（{{.Diary.CreatedAt | toJST | weekdayJP}}）{{(.Diary.CreatedAt | toJST).Format "15:04"}}</p>
        <div class="detail-content">{{.Diary.Content}}</div>
        {{if .IsOwner}}
        <a href="/diary/{{.Diary.ID}}/edit" class="edit-link">編集</a>
        {{end}}
    </main>
</body>
</html>
