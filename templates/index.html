<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物観察日記</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
            background-color: #ffffff;
            color: #333333;
            line-height: 1.6;
        }

        header {
            background-color: #4a7c59;
            color: #ffffff;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: bold;
        }

        header nav {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: auto;
        }

        header nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            opacity: 0.85;
        }

        header nav a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        header nav .user-info {
            font-size: 0.9rem;
            opacity: 0.85;
        }

        header nav .logout-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 4px;
            color: #ffffff;
            cursor: pointer;
            font-size: 0.9rem;
            opacity: 0.85;
            padding: 4px 10px;
        }

        header nav .logout-btn:hover {
            opacity: 1;
            background-color: rgba(255, 255, 255, 0.15);
        }

        main {
            max-width: 960px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .book-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .book-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            background-color: #ffffff;
            transition: box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .book-card:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .book-card-body {
            padding: 20px 16px;
        }

        .book-card-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333333;
            margin-bottom: 8px;
        }

        .book-card-date {
            font-size: 0.85rem;
            color: #888888;
        }

        .empty-message {
            text-align: center;
            color: #888888;
            padding: 48px 0;
            font-size: 1rem;
        }

        @media screen and (max-width: 640px) {
            header {
                padding: 12px 16px;
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            header h1 {
                font-size: 1.25rem;
            }

            main {
                margin: 16px auto;
                padding: 0 12px;
            }

            .book-list {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>植物観察日記</h1>
        <nav>
            {{if .LoggedIn}}
            <a href="/books">日記帳管理</a>
            <span class="user-info">{{.Username}}</span>
            <form method="POST" action="/logout" style="display:inline">
                <button type="submit" class="logout-btn">ログアウト</button>
            </form>
            {{else}}
            <a href="/login">ログイン</a>
            {{end}}
        </nav>
    </header>
    <main>
        {{if .Books}}
        <div class="book-list">
            {{range .Books}}
            <a class="book-card" href="/books/{{.ID}}">
                <div class="book-card-body">
                    <p class="book-card-name">{{.Name}}</p>
                    {{if .HasDiaries}}
                    <p class="book-card-date">最新: {{(.LatestDiaryAt | toJST).Format "2006年1月2日 15:04"}}</p>
                    {{else}}
                    <p class="book-card-date">日記なし</p>
                    {{end}}
                </div>
            </a>
            {{end}}
        </div>
        {{else}}
        <p class="empty-message">日記帳がまだ登録されていません。</p>
        {{end}}
    </main>
</body>
</html>
