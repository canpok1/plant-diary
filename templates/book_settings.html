<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物観察日記 - 日記帳設定</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
            background-color: #ffffff;
            color: #333333;
            line-height: 1.6;
        }

        header {
            background-color: #4a7c59;
            color: #ffffff;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: bold;
        }

        header h1 a {
            color: #ffffff;
            text-decoration: none;
        }

        header h1 a:hover {
            text-decoration: underline;
        }

        header nav {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: auto;
        }

        header nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            opacity: 0.85;
        }

        header nav a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        header nav .user-info {
            font-size: 0.9rem;
            opacity: 0.85;
        }

        header nav .logout-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 4px;
            color: #ffffff;
            cursor: pointer;
            font-size: 0.9rem;
            opacity: 0.85;
            padding: 4px 10px;
        }

        header nav .logout-btn:hover {
            opacity: 1;
            background-color: rgba(255, 255, 255, 0.15);
        }

        .back-link {
            display: inline-block;
            margin: 16px 24px;
            color: #4a7c59;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 24px 48px;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 32px;
        }

        .success-message {
            background-color: #e8f5e9;
            border: 1px solid #a5d6a7;
            border-radius: 6px;
            color: #2e7d32;
            font-size: 0.9rem;
            margin-bottom: 24px;
            padding: 12px 16px;
        }

        .error-message {
            background-color: #ffebee;
            border: 1px solid #ef9a9a;
            border-radius: 6px;
            color: #c62828;
            font-size: 0.9rem;
            margin-bottom: 12px;
            padding: 12px 16px;
        }

        .name-form {
            margin-bottom: 32px;
        }

        .name-input {
            border: 1px solid #cccccc;
            border-radius: 4px;
            display: block;
            font-family: inherit;
            font-size: 1rem;
            margin-bottom: 12px;
            padding: 8px 12px;
            width: 100%;
            max-width: 400px;
        }

        .name-input:focus {
            border-color: #4a7c59;
            outline: none;
        }

        .save-btn {
            background-color: #4a7c59;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 8px 20px;
        }

        .save-btn:hover {
            background-color: #3a6347;
        }

        .section-label {
            font-size: 0.9rem;
            color: #555555;
            margin-bottom: 6px;
        }

        @media screen and (max-width: 640px) {
            header {
                padding: 12px 16px;
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            header h1 {
                font-size: 1.25rem;
            }

            .back-link {
                margin: 12px 16px;
            }

            main {
                padding: 0 16px 32px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="/">植物観察日記</a></h1>
        <nav>
            <a href="/books/new">日記帳作成</a>
            <span class="user-info">{{.Username}}</span>
            <form method="POST" action="/logout" style="display:inline">
                <button type="submit" class="logout-btn">ログアウト</button>
            </form>
        </nav>
    </header>
    <a class="back-link" href="/books/{{.Book.ID}}">&larr; 日記帳詳細へ戻る</a>
    <main>
        <p class="page-title">日記帳設定</p>

        {{if .Success}}
        <div class="success-message">名前を変更しました</div>
        {{end}}

        <p class="section-title">日記帳名</p>
        {{if .Error}}
        <div class="error-message">{{.Error}}</div>
        {{end}}
        <form class="name-form" method="POST" action="/books/{{.Book.ID}}/settings">
            <input class="name-input" type="text" id="name" name="name" value="{{.FormName}}" maxlength="50" required>
            <button class="save-btn" type="submit">保存</button>
        </form>

    </main>
</body>
</html>
