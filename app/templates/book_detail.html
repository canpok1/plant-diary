<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物観察日記 - 日記帳詳細</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
            background-color: #ffffff;
            color: #333333;
            line-height: 1.6;
        }

        header {
            background-color: #4a7c59;
            color: #ffffff;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: bold;
        }

        header h1 a {
            color: #ffffff;
            text-decoration: none;
        }

        header h1 a:hover {
            text-decoration: underline;
        }

        header nav {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: auto;
        }

        header nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            opacity: 0.85;
        }

        header nav a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        header nav .user-info {
            font-size: 0.9rem;
            opacity: 0.85;
        }

        header nav .logout-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 4px;
            color: #ffffff;
            cursor: pointer;
            font-size: 0.9rem;
            opacity: 0.85;
            padding: 4px 10px;
        }

        header nav .logout-btn:hover {
            opacity: 1;
            background-color: rgba(255, 255, 255, 0.15);
        }

        .back-link {
            display: inline-block;
            margin: 16px 24px;
            color: #4a7c59;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 24px 48px;
        }

        .book-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .book-meta {
            color: #888888;
            font-size: 0.85rem;
            margin-bottom: 32px;
        }

        .section-label {
            font-size: 0.9rem;
            color: #555555;
            margin-bottom: 6px;
        }

        .upload-key-box {
            background-color: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 12px 16px;
            font-family: monospace;
            font-size: 1rem;
            word-break: break-all;
            margin-bottom: 12px;
        }

        .security-notice {
            background-color: #fff8e1;
            border: 1px solid #ffe082;
            border-radius: 6px;
            padding: 12px 16px;
            font-size: 0.85rem;
            color: #7a6400;
        }

        @media screen and (max-width: 640px) {
            header {
                padding: 12px 16px;
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            header h1 {
                font-size: 1.25rem;
            }

            .back-link {
                margin: 12px 16px;
            }

            main {
                padding: 0 16px 32px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="/">植物観察日記</a></h1>
        <nav>
            <a href="/books">日記帳</a>
            <span class="user-info">{{.Username}}</span>
            <form method="POST" action="/logout" style="display:inline">
                <button type="submit" class="logout-btn">ログアウト</button>
            </form>
        </nav>
    </header>
    <a class="back-link" href="/books">&larr; 日記帳一覧へ戻る</a>
    <main>
        <p class="book-title">{{.Book.Name}}</p>
        <p class="book-meta">作成日時: {{(.Book.CreatedAt | toJST).Format "2006年1月2日 15:04"}}</p>

        <p class="section-label">アップロードキー</p>
        <div class="upload-key-box">{{.Book.UploadKey}}</div>
        <div class="security-notice">&#x26A0; このキーは外部に公開しないでください。</div>
    </main>
</body>
</html>
